name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/vouch
          REDIS_URL: redis://localhost:6379
          GITHUB_APP_ID: "1"
          GITHUB_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nci\n-----END RSA PRIVATE KEY-----"
          GITHUB_WEBHOOK_SECRET: ci-webhook-secret
          NEXTAUTH_URL: http://localhost:3002
          NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters-long
          GITHUB_ID: ci-oauth-id
          GITHUB_SECRET: ci-oauth-secret
          VOUCH_DASHBOARD_URL: http://localhost:3002
          VOUCH_MODE: zero-cost
        run: pnpm run build

      - name: Test @vouch/core
        run: pnpm --filter @vouch/core test
