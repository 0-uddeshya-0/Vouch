<svg width="880" height="150" viewBox="0 0 880 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vouch — the AI code reviewer that doesn't trust AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="149" rx="13.5" stroke="#1e293b"/>

  <text x="440" y="72" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Vouch</text>

  <text x="440" y="112" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" fill="#94a3b8">The AI code reviewer that <tspan fill="#34d399" font-weight="600">doesn&#8217;t trust AI</tspan></text>
</svg>
