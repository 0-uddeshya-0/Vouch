# Railway config-as-code for the Vouch backend (all-in-one: server + worker).
# https://docs.railway.com/reference/config-as-code
#
# Railway is a paid host (free trial credit only). For a permanently-free
# deploy use render.yaml instead (Render free tier + Neon + Upstash).
#
# Provision Postgres and Redis as Railway services (Dashboard -> "+ New" ->
# Database), then set this service's Variables:
#
#   DATABASE_URL = ${{Postgres.DATABASE_URL}}
#   REDIS_URL    = ${{Redis.REDIS_URL}}
#   GITHUB_APP_ID, GITHUB_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET,
#   VOUCH_DASHBOARD_URL, NODE_ENV=production, VOUCH_MODE=deterministic

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrate, then boot the Fastify server AND the analysis worker in one process.
startCommand = "node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma && node apps/api/dist/all-in-one.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
