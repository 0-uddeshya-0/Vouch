# Render Blueprint — free single-service deploy for the Vouch backend.
# https://render.com/docs/blueprint-spec
#
# This runs the Fastify webhook server AND the analysis worker in ONE free web
# service (all-in-one mode), plus a free Key Value (Valkey/Redis-compatible)
# instance that is wired in automatically. Total cost: $0.
#
# Postgres is NOT created here (Render's free Postgres expires after 30 days).
# Use Neon (https://neon.tech, always-free) and paste its connection string
# into DATABASE_URL when Render prompts for it.
#
# Deploy: on Render click "New +" → "Blueprint" → pick this repo. Render reads
# render.yaml and prompts for the values marked `sync: false` below.

services:
  - type: keyvalue
    name: vouch-redis
    plan: free
    # BullMQ requires noeviction so queued jobs are never silently dropped.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  - type: web
    name: vouch-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrate, then boot server + worker in one process.
    dockerCommand: sh -c "node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma && node apps/api/dist/all-in-one.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Pure deterministic analysis — no LLM, no API key, no Ollama. Free.
      - key: VOUCH_MODE
        value: deterministic
      # Auto-wired to the Key Value instance above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vouch-redis
          property: connectionString
      # --- Neon Postgres connection string (paste when prompted) ---
      - key: DATABASE_URL
        sync: false
      # --- GitHub App credentials (from scripts/github-app/create-github-app.mjs) ---
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # --- Where PR-comment "View details" links point (your Vercel dashboard) ---
      - key: VOUCH_DASHBOARD_URL
        sync: false
