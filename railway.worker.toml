# Railway config for the Vouch WORKER service (second service, same repo).
# In the worker service settings, set "Config-as-code path" to railway.worker.toml.
# Add the same Variables as the API service (DATABASE_URL, REDIS_URL, GitHub + LLM vars).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrates (advisory-locked, safe alongside the API) then boots the built worker.
startCommand = "node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma && node apps/api/dist/worker.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
